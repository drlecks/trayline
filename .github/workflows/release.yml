name: Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you running this manually?'
        required: false
        default: 'manual trigger'

# On PRs we cancel earlier in-progress runs of the same PR (saves CI minutes
# when force-pushing). On main/dispatch we serialise to avoid publish races.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only by default; only the jobs that publish a release get write access.
permissions:
  contents: read

jobs:
  test:
    name: Typecheck + Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.5.1

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Tests
        run: pnpm test

  create-release:
    name: Create GitHub Release
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Compute version
        id: version
        run: echo "version=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.version.outputs.version }}
        run: gh release create "$TAG" --title "$TAG" --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"

  build:
    name: Build (${{ matrix.os }})
    needs: [test, create-release]
    if: always() && needs.test.result == 'success' && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        # Linux builds on the oldest supported Ubuntu: node-pty is compiled from
        # source, so the AppImage needs at least the build host's glibc.
        # ubuntu-latest (glibc 2.42) produced an AppImage that crashed on
        # Debian 13 / Ubuntu 24.04; 22.04 (glibc 2.35) runs on both.
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    # electron-builder uploads the installers to the release (never on PRs).
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.5.1

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Cache Electron binaries
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # 22.04's default gcc 11 can't compile Electron 44's V8 headers (native
      # modules need gcc >= 12.2); gcc 12 is in jammy's own repos.
      - name: Use gcc 12 (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-12 g++-12
          echo "CC=gcc-12" >> "$GITHUB_ENV"
          echo "CXX=g++-12" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild native modules for Electron
        run: pnpm run rebuild:electron

      # Patch version to 1.0.<run_number> so each release is monotonic and
      # uniquely tagged on GitHub. The package.json floor stays at 1.0.0; we
      # only bump it manually for minor/major.
      - name: Set release version
        shell: bash
        run: |
          NEW_VERSION="1.0.${{ github.run_number }}"
          echo "Setting version to ${NEW_VERSION}"
          pnpm version --no-git-tag-version --allow-same-version "${NEW_VERSION}"
          echo "RELEASE_VERSION=${NEW_VERSION}" >> "$GITHUB_ENV"

      # ── Detect signing secrets ─────────────────────────────────────────────
      # We don't fail when certs are missing — we just skip signing on that
      # platform and emit a warning so the run remains green. End users will
      # still get a usable (unsigned) build for testing.
      - name: Check Windows signing secrets
        id: win_signing
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          HAS_CSC_LINK: ${{ secrets.WIN_CSC_LINK != '' }}
          HAS_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD != '' }}
        run: |
          if [ "$HAS_CSC_LINK" = "true" ] && [ "$HAS_CSC_KEY_PASSWORD" = "true" ]; then
            echo "::notice title=Windows signing::Authenticode certificate detected — signing enabled"
            echo "signing=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Windows signing skipped::No WIN_CSC_LINK/WIN_CSC_KEY_PASSWORD secrets — producing UNSIGNED Windows build"
            echo "signing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check macOS signing secrets
        id: mac_signing
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          HAS_CSC_LINK: ${{ secrets.CSC_LINK != '' }}
          HAS_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD != '' }}
          HAS_APPLE_ID: ${{ secrets.APPLE_ID != '' }}
          HAS_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD != '' }}
          HAS_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID != '' }}
        run: |
          if [ "$HAS_CSC_LINK" = "true" ] && [ "$HAS_CSC_KEY_PASSWORD" = "true" ]; then
            echo "::notice title=macOS signing::Developer ID certificate detected — signing enabled"
            echo "signing=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=macOS signing skipped::No CSC_LINK/CSC_KEY_PASSWORD secrets — producing UNSIGNED macOS build (Gatekeeper will block end users)"
            echo "signing=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$HAS_APPLE_ID" = "true" ] && [ "$HAS_APPLE_APP_SPECIFIC_PASSWORD" = "true" ] && [ "$HAS_APPLE_TEAM_ID" = "true" ]; then
            echo "::notice title=macOS notarization::Apple ID + team detected — notarization enabled"
            echo "notarize=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=macOS notarization skipped::No APPLE_ID/APPLE_APP_SPECIFIC_PASSWORD/APPLE_TEAM_ID — notarization disabled"
            echo "notarize=false" >> "$GITHUB_OUTPUT"
          fi

      # ── Build + publish to GitHub Releases ─────────────────────────────────

      # Note: we set CSC_* env vars from inside the shell (rather than the
      # step `env:` block) because passing an empty CSC_LINK to electron-
      # builder makes it try to resolve the empty string as a file path and
      # crash. Setting the var only when signing is actually enabled keeps
      # the unsigned path clean. Secrets arrive under SECRET_* names and are
      # never expanded into the script text itself.
      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNING: ${{ steps.win_signing.outputs.signing }}
          PUBLISH: ${{ github.event_name == 'pull_request' && 'never' || 'always' }}
          SECRET_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          SECRET_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if ($env:SIGNING -eq 'true') {
            $env:CSC_LINK = $env:SECRET_CSC_LINK
            $env:CSC_KEY_PASSWORD = $env:SECRET_CSC_KEY_PASSWORD
            $env:CSC_IDENTITY_AUTO_DISCOVERY = 'true'
          } else {
            $env:CSC_IDENTITY_AUTO_DISCOVERY = 'false'
          }
          pnpm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm exec electron-builder --win --publish $env:PUBLISH

      - name: Build (macOS)
        if: matrix.os == 'macos-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNING: ${{ steps.mac_signing.outputs.signing }}
          NOTARIZE: ${{ steps.mac_signing.outputs.notarize }}
          PUBLISH: ${{ github.event_name == 'pull_request' && 'never' || 'always' }}
          SECRET_CSC_LINK: ${{ secrets.CSC_LINK }}
          SECRET_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          SECRET_APPLE_ID: ${{ secrets.APPLE_ID }}
          SECRET_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          SECRET_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "$SIGNING" = "true" ]; then
            export CSC_LINK="$SECRET_CSC_LINK"
            export CSC_KEY_PASSWORD="$SECRET_CSC_KEY_PASSWORD"
            export CSC_IDENTITY_AUTO_DISCOVERY=true
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          if [ "$NOTARIZE" = "true" ]; then
            export APPLE_ID="$SECRET_APPLE_ID"
            export APPLE_APP_SPECIFIC_PASSWORD="$SECRET_APPLE_APP_SPECIFIC_PASSWORD"
            export APPLE_TEAM_ID="$SECRET_APPLE_TEAM_ID"
          fi
          pnpm run build
          if [ "$NOTARIZE" = "true" ]; then
            pnpm exec electron-builder --mac --publish "$PUBLISH" --config.mac.notarize=true
          else
            pnpm exec electron-builder --mac --publish "$PUBLISH"
          fi

      - name: Build (Linux)
        if: matrix.os == 'ubuntu-22.04'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH: ${{ github.event_name == 'pull_request' && 'never' || 'always' }}
        run: pnpm run build && pnpm exec electron-builder --linux --publish "$PUBLISH"

      # ── Always upload installer artifacts even on failure (debug aid) ──────
      - name: Upload installer artifacts
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: trayline-${{ runner.os }}-v${{ env.RELEASE_VERSION }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.blockmap
            release/*.yml
          if-no-files-found: ignore
          retention-days: 14
