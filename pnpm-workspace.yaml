# Fail install on unsupported Node versions instead of leaving a broken
# Electron download behind (Electron 31's installer can't extract on Node 26).
engineStrict: true

# electron-builder 24 doesn't follow pnpm's symlinked node_modules when it
# packs app.asar, so transitive deps (e.g. electron-store -> conf) were left out
# and packaged builds crashed on launch. A flat, npm-style layout fixes that.
nodeLinker: hoisted

allowBuilds:
  better-sqlite3: true
  electron: true
  esbuild: true
  keytar: true
  node-pty: true

minimumReleaseAgeExclude:
  - '@radix-ui/primitive@1.1.5'
  - '@radix-ui/react-context@1.2.0'
  - '@radix-ui/react-dialog@1.1.19'
  - '@radix-ui/react-dismissable-layer@1.1.15'
  - '@radix-ui/react-focus-scope@1.1.12'
  - '@radix-ui/react-presence@1.1.7'
