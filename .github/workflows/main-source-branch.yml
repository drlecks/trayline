name: Main Source Branch

# Only develop may be merged into main. Required on main via the
# main-protection ruleset; repository admins can still bypass in an emergency.
on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  only-develop:
    name: Only develop into main
    runs-on: ubuntu-latest
    steps:
      - name: Check source branch
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REF" != "develop" ] || [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo "::error::Pull requests into main must come from this repository's develop branch (got $HEAD_REPO:$HEAD_REF)."
            exit 1
          fi
          echo "Source branch is develop — OK."
