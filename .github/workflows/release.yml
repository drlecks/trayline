name: Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you running this manually?'
        required: false
        default: 'manual trigger'

# On PRs we cancel earlier in-progress runs of the same PR (saves CI minutes
# when force-pushing). On main/dispatch we serialise to avoid publish races.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Typecheck + Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

  build:
    name: Build (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache Electron binaries
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      # Patch version to 1.0.<run_number> so each release is monotonic and
      # uniquely tagged on GitHub. The package.json floor stays at 1.0.0; we
      # only bump it manually for minor/major.
      - name: Set release version
        shell: bash
        run: |
          NEW_VERSION="1.0.${{ github.run_number }}"
          echo "Setting version to ${NEW_VERSION}"
          npm version --no-git-tag-version --allow-same-version "${NEW_VERSION}"
          echo "RELEASE_VERSION=${NEW_VERSION}" >> "$GITHUB_ENV"

      # ── Detect signing secrets ─────────────────────────────────────────────
      # We don't fail when certs are missing — we just skip signing on that
      # platform and emit a warning so the run remains green. End users will
      # still get a usable (unsigned) build for testing.
      - name: Check Windows signing secrets
        id: win_signing
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          if [ -n "${{ secrets.WIN_CSC_LINK }}" ] && [ -n "${{ secrets.WIN_CSC_KEY_PASSWORD }}" ]; then
            echo "::notice title=Windows signing::Authenticode certificate detected — signing enabled"
            echo "signing=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Windows signing skipped::No WIN_CSC_LINK/WIN_CSC_KEY_PASSWORD secrets — producing UNSIGNED Windows build"
            echo "signing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check macOS signing secrets
        id: mac_signing
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          if [ -n "${{ secrets.CSC_LINK }}" ] && [ -n "${{ secrets.CSC_KEY_PASSWORD }}" ]; then
            echo "::notice title=macOS signing::Developer ID certificate detected — signing enabled"
            echo "signing=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=macOS signing skipped::No CSC_LINK/CSC_KEY_PASSWORD secrets — producing UNSIGNED macOS build (Gatekeeper will block end users)"
            echo "signing=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "${{ secrets.APPLE_ID }}" ] && [ -n "${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" ] && [ -n "${{ secrets.APPLE_TEAM_ID }}" ]; then
            echo "::notice title=macOS notarization::Apple ID + team detected — notarization enabled"
            echo "notarize=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=macOS notarization skipped::No APPLE_ID/APPLE_APP_SPECIFIC_PASSWORD/APPLE_TEAM_ID — notarization disabled"
            echo "notarize=false" >> "$GITHUB_OUTPUT"
          fi

      # ── Build + publish to GitHub Releases ─────────────────────────────────

      # Note: we set CSC_* env vars from inside the shell (rather than the
      # step `env:` block) because passing an empty CSC_LINK to electron-
      # builder makes it try to resolve the empty string as a file path and
      # crash. Setting the var only when signing is actually enabled keeps
      # the unsigned path clean.
      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ('${{ steps.win_signing.outputs.signing }}' -eq 'true') {
            $env:CSC_LINK = '${{ secrets.WIN_CSC_LINK }}'
            $env:CSC_KEY_PASSWORD = '${{ secrets.WIN_CSC_KEY_PASSWORD }}'
            $env:CSC_IDENTITY_AUTO_DISCOVERY = 'true'
          } else {
            $env:CSC_IDENTITY_AUTO_DISCOVERY = 'false'
          }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx electron-builder --win --publish ${{ github.event_name == 'pull_request' && 'never' || 'always' }}

      - name: Build (macOS)
        if: matrix.os == 'macos-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ steps.mac_signing.outputs.signing }}" = "true" ]; then
            export CSC_LINK="${{ secrets.CSC_LINK }}"
            export CSC_KEY_PASSWORD="${{ secrets.CSC_KEY_PASSWORD }}"
            export CSC_IDENTITY_AUTO_DISCOVERY=true
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          if [ "${{ steps.mac_signing.outputs.notarize }}" = "true" ]; then
            export APPLE_ID="${{ secrets.APPLE_ID }}"
            export APPLE_APP_SPECIFIC_PASSWORD="${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}"
            export APPLE_TEAM_ID="${{ secrets.APPLE_TEAM_ID }}"
          fi
          npm run build
          if [ "${{ steps.mac_signing.outputs.notarize }}" = "true" ]; then
            npx electron-builder --mac --publish ${{ github.event_name == 'pull_request' && 'never' || 'always' }} --config.mac.notarize=true
          else
            npx electron-builder --mac --publish ${{ github.event_name == 'pull_request' && 'never' || 'always' }}
          fi

      - name: Build (Linux)
        if: matrix.os == 'ubuntu-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build && npx electron-builder --linux --publish ${{ github.event_name == 'pull_request' && 'never' || 'always' }}

      # ── Always upload installer artifacts even on failure (debug aid) ──────
      - name: Upload installer artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: trayline-${{ runner.os }}-v${{ env.RELEASE_VERSION }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.blockmap
            release/*.yml
          if-no-files-found: ignore
          retention-days: 14
