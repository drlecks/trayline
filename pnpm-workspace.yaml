# Fail install on unsupported Node versions (Electron and @electron/rebuild
# need >= 22.12) instead of half-installing.
engineStrict: true

# electron-builder (seen with v24) doesn't follow pnpm's symlinked node_modules when it
# packs app.asar, so transitive deps (e.g. electron-store -> conf) were left out
# and packaged builds crashed on launch. A flat, npm-style layout fixes that.
nodeLinker: hoisted

# Same-major patch releases of transitive deps flagged by Centurion Cloud
# Security (osv.dev advisories). Drop an entry once its parent ships the fix.
overrides:
  '@xmldom/xmldom@^0.9': 0.9.12
  baseline-browser-mapping: 2.11.29
  brace-expansion@^1: 1.1.21
  brace-expansion@^2: 2.1.7
  browserslist: 4.28.9
  fast-uri@^3: 3.1.9
  http-cache-semantics: 4.3.0
  ip-address: 10.7.4
  js-yaml@^4: 4.3.2
  nanoid@^3: 3.3.20
  postcss@^8: 8.5.31
  postcss-selector-parser@^6: 6.1.5
  source-map-js: 1.2.2
  tar@^7: 7.5.22
  undici@^6: 6.29.1
  uuid@^8: 11.1.1

allowBuilds:
  better-sqlite3: true
  electron: true
  electron-winstaller: false
  esbuild: true
  keytar: true
  node-pty: true

minimumReleaseAgeExclude:
  - '@radix-ui/primitive@1.1.5'
  - '@radix-ui/react-context@1.2.0'
  - '@radix-ui/react-dialog@1.1.19'
  - '@radix-ui/react-dismissable-layer@1.1.15'
  - '@radix-ui/react-focus-scope@1.1.12'
  - '@radix-ui/react-presence@1.1.7'
