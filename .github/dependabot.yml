version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    target-branch: "develop"
    open-pull-requests-limit: 10
    # Match the 7-day package age gate (check-dependency-age.yml) so Dependabot
    # never proposes versions that the gate would reject.
    cooldown:
      default-days: 7
